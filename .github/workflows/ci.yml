name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Enforce anti-slop and library conventions
        run: bun run lint

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # npm 10 crashes in Arborist while resolving the packed test fixture.
      - name: Use validated npm for consumer installs
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (vp pack + publint)
        run: bun run build

      - name: Verify bundled skill documentation
        run: bun run skills:check

      - name: Verify packed package contents
        run: bunx vp test run test/package-contents.test.mjs

      - name: Verify shared helper identity in npm and Bun consumers
        run: node scripts/test-packed-ids.mjs

      - name: Verify published Oxlint plugin in npm and Bun consumers
        run: node scripts/test-packed-oxlint.mjs

      - name: Verify auth declarations across Convex context versions
        run: node scripts/test-packed-auth.mjs

      - name: Verify packed variant public API, native codegen, and runtime
        run: node scripts/test-packed-variants.mjs

      - name: Verify installed variant query engine with native Convex
        run: node scripts/test-packed-variant-querying.mjs

      - name: Typecheck
        run: bun run typecheck

      # The full unit/rule/stress suite remains available locally via bun run test.
      # Published rule behavior is covered above by the packed Oxlint consumer gate.
      - name: Test integration boundaries
        run: bun run test:integration

  packed-component-smoke:
    # Each matrix entry builds its own artifact; it need not wait for verify.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installer: [bun, npm]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packed component artifact
        run: bun run build

      - name: Deploy and exercise packed components (${{ matrix.installer }})
        run: |
          if [ "${{ matrix.installer }}" = "bun" ]; then
            bun scripts/smoke-packed-components.mjs bun
          else
            node scripts/smoke-packed-components.mjs npm
          fi
