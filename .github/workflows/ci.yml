name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (vp pack + publint)
        run: bun run build

      # Unit, regression, stress, and packed compatibility suites run locally.
      - name: Test integration boundaries
        run: bun run test:integration

  packed-component-smoke:
    # Builds its own artifact; it need not wait for verify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packed component artifact
        run: bun run build

      - name: Deploy and exercise packed components (Bun)
        run: bun scripts/smoke-packed-components.mjs bun
