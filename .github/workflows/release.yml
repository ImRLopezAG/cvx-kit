name: Release

# npm Trusted Publishing (OIDC): no NPM_TOKEN anywhere. The trust
# relationship is configured on npmjs.com for this package, pointing at
# this repository + this workflow file + the "npm" environment.
# Provenance attestations are generated automatically.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # contents: write is required by `gh release create` only; the npm
      # publish itself needs nothing beyond id-token.
      contents: write
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test


      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release with CHANGELOG notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          node scripts/extract-changelog.mjs "$VERSION" release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
